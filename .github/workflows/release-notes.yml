name: Release notes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  consistent-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release_notes.py --check
